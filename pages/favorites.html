<body data-layout="favorites" data-root="../">
  <a class="skip-link" href="#catalog">跳到我的收藏</a>
  <header class="masthead">
    <a class="identity" href="../index.html"><span class="wordmark">Lemo–Opuscar</span><span class="edition">本地使用手册</span></a>
    <nav class="toplinks" aria-label="使用指南"><button type="button" data-guide="start">开始使用</button><button type="button" data-guide="director">导演手册</button></nav>
  </header>
  <nav id="viewMode" class="view-toolbar" aria-label="切换阅读方式"><span>阅读方式</span><div class="layout-switch"><a href="catalog.html" data-layout-link="catalog">图像目录</a><a href="workbench.html" data-layout-link="workbench">阅读工作台</a><a href="cinema.html" data-layout-link="cinema">放映阅读室</a></div><button type="button" data-guide="start">使用指南</button></nav>
  <main class="page">
    <section class="introduction"><h1>收藏喜欢的画面，<br>留给下一次创作。</h1><p>收藏保存在当前浏览器。通过本手册内的链接切换阅读方式，可以继续查看收藏；不会自动同步到其它设备。清除浏览器数据会移除收藏。</p></section>
    <section id="catalog" aria-label="收藏目录">
      <div class="catalog-toolbar">
        <nav class="collection-tabs" aria-label="收藏集合"><button type="button" data-mode="all">全部</button><button type="button" data-mode="styles">技能风格</button><button type="button" data-mode="films">影片案例</button></nav>
        <label class="search-field"><input id="search" type="search" placeholder="搜索收藏的风格或影片…" aria-label="搜索收藏"></label>
      </div>
      <div class="filter-shelf"><p id="filterLabel" class="filter-label">我的收藏</p><nav id="filters" class="filters" aria-label="分类筛选"></nav></div>
      <div class="results-heading"><div><h2 id="resultTitle">我的收藏</h2><p id="resultDescription"></p></div><span id="resultCount" class="result-count" aria-live="polite"></span></div>
      <div id="results" class="results"></div>
      <div id="empty" class="empty" hidden><h3>还没有收藏</h3><p>到风格库点击“收藏”，即可加入这里。</p><button id="clearSearch" type="button" class="secondary">清除搜索与筛选</button></div>
    </section>
    <footer class="page-footer"><div>LemoLab 官方资料 · 文档 MIT / 示例图片 CC BY 4.0<br>本地快照 <span id="snapshotDate"></span> · 视频链接需要联网</div><div><button id="licenseButton" type="button">来源与授权</button><a href="https://github.com/lemomo-ai/lemo-opuscar" target="_blank" rel="noopener">LemoLab 原仓库（联网）</a></div></footer>
  </main>
  <dialog id="detailDialog" class="detail-dialog"><div id="detailBody"></div></dialog>
  <dialog id="guideDialog" class="guide-dialog"><header class="guide-head"><h2 id="guideTitle"></h2><form method="dialog"><button class="icon-button" aria-label="关闭手册">×</button></form></header><div id="guideContent"></div></dialog>
  <dialog id="copyFallback"><h2>复制内容</h2><p id="copyHelp"></p><textarea id="copyText" rows="14" readonly aria-label="待复制内容"></textarea><form method="dialog"><button class="secondary">完成</button></form></dialog>
  <div id="notice" class="notice" role="status" hidden></div>
